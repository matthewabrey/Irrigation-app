<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abreys Irrigation</title>
<meta name="theme-color" content="#2a2a27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Irrigation">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="irrigation.webmanifest">
<link rel="apple-touch-icon" href="irrigation-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Abreys house style — matched to the Abreys Day to Day Work App (abreys.app) */
:root{
  --bg:#f6f4ee;          /* warm off-white page          hsl(45 31% 95%) */
  --card:#fff;
  --bd:#dcd8cb;          /* soft beige border            hsl(45 20% 83%) */
  --bd2:#c4c0b2;         /* input border */
  --muted:#efebe1;       /* muted fills                  hsl(45 25% 91%) */
  --tx:#20201e;          /* text                          hsl(60 3% 12%) */
  --tx2:#3e3e39;         /* labels */
  --tx3:#6b6b66;         /* muted text                   hsl(60 2% 41%) */
  --tx4:#9a968a;         /* faint */
  --hdr:#2a2a27;         /* charcoal top bar */
  --hdrtx:#ddd9cc; --hdrtx2:#c4c0b2;
  --pri:#7db82b;         /* Abreys lime green            hsl(85 62% 45%) */
  --pri2:#6a9e22;        /* hover */
  --g1:#5d8f1c;          /* green text / accents */
  --g2:#7db82b;
  --g3:#e5f1d4;          /* light green fill             hsl(81 53% 89%) */
  --gdk:#446614;         /* dark green text on light green */
  --r1:#c0392b;--r2:#e67e22;--r3:#1565c0;--ok:#e5f1d4;--okt:#446614;
  --serif:ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit}
header{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--hdrtx);box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);padding:0 14px;padding-top:env(safe-area-inset-top)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;color:var(--hdrtx2);font-size:14px;font-weight:500;white-space:nowrap}
.brand img{height:38px;width:auto;border-radius:2px;display:block}
.brand b{color:#fff;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.3px}
.sp{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:2px}
.seg button{border:0;background:transparent;color:var(--hdrtx);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--pri);color:#fff}
.who{font-size:13px;font-weight:500;color:var(--hdrtx);cursor:pointer}
.who:hover{color:#9fd45a}
#live{color:var(--hdrtx2)}
.savebtn{border:0;border-radius:6px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)}
.savebtn:hover{background:var(--pri2)}
.savebtn.dirty{background:#f2c94c;color:#3e2b00}
.savebtn:disabled{opacity:.6;cursor:default}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--hdr);border-top:1px solid rgba(255,255,255,.07);position:sticky;top:var(--hh,60px);z-index:19;scrollbar-width:none;padding:0 8px}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--hdrtx);white-space:nowrap;border-bottom:3px solid transparent;font-size:13.5px;font-weight:500}
nav button:hover{color:#9fd45a}
nav button.on{color:#fff;border-bottom-color:var(--pri)}
main{padding:16px;max-width:1300px;margin:0 auto}
.banner{border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.banner.warn{background:#fdf6e3;border:1px solid #efd9a0;color:#5d4300}
.banner.info{background:var(--g3);border:1px solid #cfe3b3;color:var(--gdk)}
.banner.err{background:#fbeceb;border:1px solid #efc4bf;color:#7b1d12}
.muted{color:var(--tx3)}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0;font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.3px;color:var(--tx);padding:11px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .small,.card h3 .muted{font-family:var(--sans);letter-spacing:0}
.pad{padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{cursor:pointer;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;border:0;user-select:none}
.chip.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--tx)}
.c1{background:var(--r1);color:#fff}.c2{background:var(--r2);color:#fff}.c3{background:var(--r3);color:#fff}
.c4{background:var(--ok);color:var(--okt)}.c5{background:var(--muted);color:var(--tx4)}.c6{background:var(--muted);color:var(--tx3)}.c7{background:#eceef3;color:#5a6680}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--bd2);border-radius:6px;background:#fff;font-size:13px;max-width:100%;color:var(--tx)}
.filters select:focus,.filters input:focus,.form input:focus,.form select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(125,184,43,.35)}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid #ece9df;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--tx3);background:#faf9f5;position:sticky;top:0;z-index:2;white-space:nowrap;font-weight:600}
th.s{cursor:pointer}
th.s:hover{color:var(--tx)}
td.n,th.n{text-align:right;white-space:nowrap}
td.fn{font-weight:600;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1;cursor:pointer;color:var(--g1)}
th.fn{position:sticky;left:0;z-index:3}
tr:hover td{background:#fbfaf6}
tr:hover td.fn{background:#fbfaf6}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.sub{font-size:11px;color:var(--g1);font-weight:500}
.grid td{padding:3px 2px;text-align:center;min-width:42px}
.grid td.fn,.grid th.fn{text-align:left;padding-left:10px;min-width:150px}
.grid th{text-align:center;font-size:11px;padding:5px 2px}
.grid .today{background:#f3f8ea}
.gp{display:inline-block;min-width:26px;border-radius:5px;padding:2px 4px;font-size:11px;font-weight:700;cursor:pointer}
.gp.a{background:var(--pri);color:#fff}.gp.a.low{background:#c9d6b3}
.gp.p{background:var(--r3);color:#fff}
.gp.d{background:var(--r1);color:#fff;border-radius:50%;min-width:20px;height:20px;line-height:16px;padding:2px}
.gp.e{color:#cfcbbd;font-weight:400}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);transition:background .15s}
.btn:hover{background:var(--pri2);border-color:var(--pri2)}
.btn.o{background:#fff;color:var(--tx);border-color:var(--bd2);box-shadow:none}
.btn.o:hover{background:var(--muted)}
.btn.r{background:#fff;color:var(--r1);border-color:#e6bfba;box-shadow:none}
.btn.r:hover{background:#fbeceb}
.btn.sm{padding:5px 11px;font-size:12.5px}
.x{border:0;background:none;color:var(--r1);cursor:pointer;font-size:15px;padding:2px 6px}
.lnk{color:var(--g1);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.form{display:grid;gap:12px}
.form label{display:block;font-size:14px;font-weight:500;color:var(--tx2);margin-bottom:5px}
.form input,.form select{width:100%;padding:10px 12px;border:1px solid var(--bd2);border-radius:6px;font-size:16px;background:#fff;color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:11px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--g1)}
.kpi .v{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.6px;color:var(--tx)}
.kpi .s{font-size:12px;color:var(--tx3)}
.bar{height:8px;background:var(--muted);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.hi{background:var(--r2)}.bar i.over{background:var(--r1)}
.modal{position:fixed;inset:0;background:rgba(32,32,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 10px 25px rgba(0,0,0,.15)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:12px}}
.sheet h2{margin:0 0 4px;font-size:22px;color:var(--tx);font-family:var(--serif);font-weight:600;letter-spacing:-.6px}
.plist div{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed #ece9df;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;opacity:.97;max-width:90vw;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.gapl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px}
.gapl div{display:flex;align-items:center;gap:6px}
.gapl input{width:64px;padding:6px;border:1px solid var(--bd2);border-radius:6px}
.loading{padding:40px;text-align:center;color:var(--tx3)}
/* sign-in screen — same as the Day to Day Work App login */
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{background:#fff;border-radius:12px;width:100%;max-width:352px;padding:22px 19px 19px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.login img{height:43px;margin:0 auto 14px;display:block}
.login .tag{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--g1);text-transform:uppercase;margin:0 0 4px;line-height:1.3}
.login h1{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.6px;color:var(--tx);margin:0 0 4px}
.login .s1{font-size:14px;color:var(--tx3)}
.login .s2{font-size:12px;color:var(--tx4);margin:8px 0 22px}
.login label{display:block;text-align:left;font-size:14px;font-weight:500;color:var(--tx2);margin-bottom:6px}
.login input{width:100%;padding:8px 12px;border:1px solid var(--bd2);border-radius:6px;font-size:16px;margin-bottom:12px}
.login input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(125,184,43,.35)}
.login .btn{width:100%;padding:8px 16px;font-size:14px}
.login .err{color:var(--r1);font-size:12.5px;min-height:16px;text-align:left;margin:-6px 0 6px}
@media(max-width:600px){main{padding:10px}th,td{padding:6px 6px}.hide-m{display:none}.brand b{font-size:15px}.brand img{height:32px}.hrow{min-height:54px;gap:8px}}
</style>
</head>
<body>
<header id="hdr">
  <div class="hrow">
    <div class="brand"><img src="https://abreys.app/abreys-logo.png" alt="Abreys" onerror="this.style.display='none'"><b>Irrigation</b></div>
    <div class="seg" id="seasonSeg"></div>
    <div class="sp"></div>
    <span class="small" id="live" style="opacity:.9"></span><span class="who" id="who" onclick="signIn()"></span>
    <button class="savebtn" id="saveBtn" onclick="save(false)">Saved</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="loading">Loading fields from FieldPlan…</div></main>
<div id="modalHost"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ABREYS IRRIGATION — v1 (10/11/26)
   Masters (re-read every load, never copied): FieldPlan.html (fields, estates,
   zones, cropping, water rates, isOurs/zone rules) and Omnia via the relay
   (varieties, onion types, working areas, field names).
   This app only stores irrigation records + its own settings, keyed by Omnia oid
   (fallback estate|field), in irr_data.json via the relay. It publishes
   irr_live.json (the FieldPlan Water-page contract) on every save.
   RULE: a pass of 5mm or less never counts — not for apps, totals or the countdown.
   ═══════════════════════════════════════════════════════════════════════════ */
var RELAY=new URLSearchParams(location.search).get('relay')||'https://fieldplan-relay.matt-6c6.workers.dev/';  // ?relay= only for testing
var RAW='https://raw.githubusercontent.com/matthewabrey/Abrey-Cropping/main/';
var QS=new URLSearchParams(location.search);
var FP_URL=QS.get('fp')||(RAW+'FieldPlan.html');
var LIVE_YR='2027';            // current season = harvest 2027
var IRR_CROPS=['Potatoes','Salad Potatoes','Seed Potatoes','Carrots','Parsnips','Onions'];
var AC_PER_HA=2.471, GAL_PER_ACIN=22610.67, M3_PER_ACIN=102.79, MIN_MM=5;
var MONTHS=['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
var MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── state ─────────────────────────────────────────────────────────────── */
var FP=null;              // {F,WC,WC_VAR,WATER_CFG,USERS,src,t}
var FN=null;              // FieldPlan's own gc/isOurs/wcRate/zoneFields, run against FP
var OMV={};               // Omnia variety/type per oid per year (same shape as FieldPlan's _omVar)
var OMT=null;             // when Omnia last loaded
var SERVER=null;          // last saved irr_data.json
var LOCAL=null;           // working copy = SERVER + unsaved changes
var PEND={f:{},o:{},del:{},cfg:0};
var R26=null;             // irr_2026.json (last season's records)
var SRC={fp:'',om:'',data:''};
var S={season:LIVE_YR,view:'plan',supEst:'',staffAs:'',est:'',area:'',crop:'',vr:'',st:'',q:'',sortK:'',sortD:1,gOff:0,asAt:'2026-07-15',zoneOnly:''};
var _s0=null;try{var _s=JSON.parse(localStorage.getItem('irr_ui')||'null');_s0=_s;if(_s)['view','est','crop','asAt'].forEach(function(k){if(_s[k]!=null)S[k]=_s[k];});}catch(e){}

/* ── small helpers ─────────────────────────────────────────────────────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsq(s){return "decodeURIComponent('"+encodeURIComponent(s)+"')";}
function pad(n){return (n<10?'0':'')+n;}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayIso(){return S.season===LIVE_YR?isoOf(new Date()):S.asAt;}
function addDays(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d);}
function dDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function dm(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';}
function fmt(n,dp){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('en-GB',{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function newId(){var u=user();return Date.now().toString(36)+Math.random().toString(36).slice(2,5)+(u?u.emp:'');}
function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove();},2600);}
function user(){try{return JSON.parse(localStorage.getItem('fp_user')||'null');}catch(e){return null;}}
function saveUi(){try{localStorage.setItem('irr_ui',JSON.stringify({view:S.view,est:S.est,crop:S.crop,asAt:S.asAt}));}catch(e){}}

/* ── reading FieldPlan's source: bracket matching that respects strings/comments ── */
function scanEnd(s,start,code){
  var depth=0,q=null;
  for(var i=start;i<s.length;i++){
    var c=s[i];
    if(q){if(c==='\\'){i++;continue;}if(c===q)q=null;continue;}
    if(c==='"'||c==="'"||c==='`'){q=c;continue;}
    if(code&&c==='/'&&s[i+1]==='/'){i=s.indexOf('\n',i);if(i<0)return -1;continue;}
    if(code&&c==='/'&&s[i+1]==='*'){i=s.indexOf('*/',i+2)+1;continue;}
    if(c==='{'||c==='['||c==='(')depth++;
    else if(c==='}'||c===']'||c===')'){depth--;if(depth===0)return i;}
  }
  return -1;
}
function grabVal(h,re){
  var m=re.exec(h);if(!m)throw new Error('not found: '+re);
  var b=m.index+m[0].length-1, e=scanEnd(h,b,false);
  return JSON.parse(h.slice(b,e+1));
}
function grabFn(h,name){
  var i=h.indexOf('function '+name+'(');if(i<0)throw new Error('function '+name+' not found');
  var b=h.indexOf('{',h.indexOf(')',i)), e=scanEnd(h,b,true);
  return h.slice(i,e+1);
}
function parseFieldPlan(h){
  return {
    F:grabVal(h,/const F\s*=\s*\[/),
    WC:grabVal(h,/var WC\s*=\s*\{/),
    WC_VAR:grabVal(h,/var WC_VAR\s*=\s*\{/),
    WATER_CFG:grabVal(h,/var WATER_CFG\s*=\s*\{/),
    USERS:grabVal(h,/var USERS\s*=\s*\[/),
    src:['gc','isOurs','wcRate','zoneFields'].map(function(n){return grabFn(h,n);}).join('\n'),
    t:Date.now()
  };
}
function buildFns(){
  // Run FieldPlan's OWN rules (isOurs, crop lookup, water rate, zone membership) so they never drift.
  try{
    var mk=new Function('F','WC','WC_VAR','_omVar','return (function(){'+FP.src+'\nreturn {gc:gc,isOurs:isOurs,wcRate:wcRate,zoneFields:zoneFields};})();');
    FN=mk(FP.F,FP.WC,FP.WC_VAR,OMV);
  }catch(e){
    console.error('FieldPlan rules failed, using fallback',e);
    FN={gc:function(f,y){return y<='2026'?(f.history[y]||''):(f.plan[y]||'');},
        isOurs:function(f,y){return IRR_CROPS.indexOf(FN.gc(f,y))>=0;},
        wcRate:function(f,y){return FP.WC[FN.gc(f,y)];},
        zoneFields:function(z){return FP.F.filter(function(f){return f.estate===z.estate;});}};
    SRC.rulesErr=String(e.message||e);
  }
}

/* ── Omnia (via relay) ─────────────────────────────────────────────────── */
function parseCsv(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  var rows=[],cur=[],fv='',q=false,head=null;
  function end(){cur.push(fv);fv='';if(cur.length>1||cur[0]!==''){if(!head)head=cur;else{var o={};for(var j=0;j<head.length;j++)o[head[j]]=cur[j]||'';rows.push(o);}}cur=[];}
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){fv+='"';i++;}else q=false;}else fv+=c;}
    else if(c==='"')q=true; else if(c===','){cur.push(fv);fv='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;end();} else fv+=c;}
  if(fv!==''||cur.length)end();
  return rows;
}
function applyOmniaFields(rows){
  var byId={};
  rows.forEach(function(r){if(r.HoldingId!=='15859')return;byId[r.FieldId]={n:r.FieldName,ha:parseFloat(r.WorkingArea||'')||0};});
  FP.F.forEach(function(f){var o=f.oid&&byId[f.oid];if(!o)return;
    if(o.n)f.field=o.n;
    if(o.ha>0.01&&Math.abs(o.ha-f.ha)>0.005&&!(f.estate==='Genevieve'&&o.ha>100))f.ha=Math.round(o.ha*100)/100; // Genevieve "20" 137ha Omnia error ignored
  });
}
function applyOmniaCropping(rows){
  Object.keys(OMV).forEach(function(k){delete OMV[k];});
  rows.forEach(function(r){
    if(r.HoldingId!=='15859'||!r.VarietyName)return;

/* ── fields, crop, variety ─────────────────────────────────────────────── */
function key(f){return (f.oid&&f.oid!=='none')?String(f.oid):(f.estate+'|'+f.field);}

}

}

function setIrrHa(k,v){if(!canEdit())return;var c=cfg();c.irrHa=c.irrHa||{};if(v===''||!(+v>0))delete c.irrHa[k];else c.irrHa[k]=+v;var f=BYKEY[k];if(LOCAL.log[k])touch(f);cfgTouch();openField(k);}

function cfg(){return LOCAL.cfg||(LOCAL.cfg={gap:{},add:{},hide:{}});}
function log(){

function fieldList(){

/* ── warning days (look-back): variety/type line beats crop line ───────── */
function gapFor(c,sub){
  var g=cfg().gap||{};
  if(sub&&g[c+'|'+sub]!=null&&g[c+'|'+sub]!=='')return +g[c+'|'+sub];

}

/* ── the 1/2/3 status for one field ────────────────────────────────────── */
function stat(f){
  var c=crop(f),k=key(f),L=log()[k]||{},T=todayIso();
  var p=(L.p||[]).filter(function(x){return x[0]<=T||!is26();}).slice().sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});
  var last=null,mm=0,apps=0;
  p.forEach(function(x){var ap=+x[2]||0;if(ap>MIN_MM){mm+=ap;apps++;if(!last||x[0]>last)last=x[0];}});
  var perAc=mm/25.4, sb=sub1(f), gap=gapFor(c,sb);
  var days=last?dDiff(last,T):null, st=is26()?(fin26(f)?9:0):(L.st||0);
  var g=(is26()?[]:(L.g||[])).slice().sort(function(a,b){return a[0]<b[0]?-1:1;});
  var nextProg=null; g.forEach(function(x){if(x[0]>=T&&(!nextProg||x[0]<nextProg))nextProg=x[0];});
  var dueIso=(last&&gap!=null)?addDays(last,gap):null;
  var code,lab;
  if(st===9){code=7;lab='Finished for season';}
  else if(st===2){code=2;lab='2 · Definitely start'+(L.mm2?' · '+L.mm2+'mm':'');}
  else if(nextProg){code=3;lab='3 · Programme '+dm(nextProg)+(nextProg===T?' (today)':'');}
  else if(st===3){code=3;lab='3 · On programme';}
  else if(last==null){code=6;lab='Not started';}
  else if(gap==null){code=5;lab='Set warning days';}
  else if(days>=gap){code=1;lab='1 · Due — '+days+'d since ('+gap+'d set)';}
  else{code=4;lab='OK · due in '+(gap-days)+'d';}
  return {c:c,k:k,L:L,p:p,g:g,nextProg:nextProg,dueIso:dueIso,last:last,days:days,gap:gap,perAc:perAc,mm:mm,apps:apps,st:st,mm2:L.mm2,code:code,lab:lab,sub:sb};
}

/* ── load / save (relay) ───────────────────────────────────────────────── */
var RAW_DATA='https://raw.githubusercontent.com/matthewabrey/Abrey-Cropping/irrigation-data/irr_data.json';
function emptyData(){return {v:1,season:LIVE_YR,cfg:{gap:{},add:{},hide:{},irrHa:{},runs:{},runLen:{},mach:[],team:{}},log:{},ops:{}};}
function normData(j){

// LOCAL = latest server copy + anything still pending on this device
function rebase(prev){

  Object.keys(PEND.o||{}).forEach(function(k){if(prev.ops&&prev.ops[k])LOCAL.ops[k]=prev.ops[k];});

async function fetchServer(){

    if(r.ok){var o=await r.json();if(o&&o.ok){j=o.data||emptyData();SRC.data='saved data (live)';SRC.relay=true;LIVE_OK=Date.now();window._lastPull=Date.now();}}}catch(e){}
  if(!j){try{var r2=await fetch(RAW_DATA+'?t='+Date.now());if(r2.ok){j=await r2.json();SRC.data='saved data (published copy, may lag ~5 min)';}}catch(e){}}

      prev={log:sh.log||{},ops:sh.ops||{},cfg:sh.cfg};}}catch(e){}

async function pull(){ // pick up everyone else's changes
  if(SAVING||!LOCAL)return;window._lastPull=Date.now();
  var u=user(),j=null;
  try{var r=await fetch(RELAY+'irr-data?emp='+encodeURIComponent(u?u.emp:'')+'&since='+encodeURIComponent(SERVER&&SERVER.updated||''),{cache:'no-store'});
    if(r.ok){var o=await r.json();if(o&&o.ok){LIVE_OK=Date.now();if(o.same){paintLive();return;}j=o.data;}}}catch(e){}
  if(!j){paintLive();return;}

var LIVE_OK=0;
function paintLive(){var el=document.getElementById('live');if(!el)return;
  var ok=LIVE_OK&&Date.now()-LIVE_OK<70000&&navigator.onLine;
  el.innerHTML='<span style="color:'+(ok?'#7CFC9A':'#ffd54f')+'">●</span> '+(ok?'Live':(navigator.onLine?'Connecting…':'No signal — saving on phone'));
  el.title=LIVE_OK?'last update '+new Date(LIVE_OK).toLocaleTimeString('en-GB'):'';}
var SAVING=false,_saveT=null,_saveErr='';
function schedSave(){clearTimeout(_saveT);_saveT=setTimeout(function(){save(true);},2500);}
async function save(auto){
  if(SAVING){schedSave();return;}
  if(!nPending()){if(!auto)toast('All saved');return;}
  var u=user();if(!u){signIn();_saveErr='sign in to save';render();return;}
  var sent={f:Object.assign({},PEND.f),o:Object.assign({},PEND.o),cfg:PEND.cfg,del:clone(PEND.del)};
  var body={emp:u.emp,season:LIVE_YR,fields:{},ops:{},del:sent.del,cfg:sent.cfg?LOCAL.cfg:null};
  Object.keys(sent.f).forEach(function(k){body.fields[k]=LOCAL.log[k]||null;});
  Object.keys(sent.o).forEach(function(k){body.ops[k]=LOCAL.ops[k]||null;});
  SAVING=true;render();

    var res=await fetch(RELAY+'irr-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var out={};try{out=await res.json();}catch(e){}
    if(res.status===403)throw new Error(out.error||'your employee number isn’t set up to record irrigation — ask Matthew to add you under Settings → Team');
    if(res.status===404||(!res.ok&&!out.error))throw new Error('the relay has no irrigation route yet — entries are kept on this device');
    if(!res.ok||!out.ok)throw new Error(out.error||('relay error '+res.status));
    // clear only what this save carried and hasn't changed since
    Object.keys(sent.f).forEach(function(k){if(PEND.f[k]===sent.f[k])delete PEND.f[k];});

    if(PEND.cfg===sent.cfg)PEND.cfg=0;

  }catch(e){_saveErr=navigator.onLine?e.message:'no signal';if(!auto)toast('Not saved yet: '+_saveErr);}

  if(nPending()&&!_saveErr)schedSave();
}
window.addEventListener('online',function(){paintLive();if(nPending())save(true);pull();});window.addEventListener('offline',paintLive);
// LIVE: every open screen re-reads the shared data every 20 s (and on waking / regaining signal),

/* ── filtering & sorting shared by the views ───────────────────────────── */
function filtered(){
  var all=fieldList(),list=[],stats=[];
  var q=(S.q||'').toLowerCase();
  all.forEach(function(f){
    if(S.est&&f.estate!==S.est)return; if(S.area&&areaOf(f)!==S.area)return;
    if(S.crop&&crop(f)!==S.crop)return; if(S.vr&&sub1(f)!==S.vr)return;
    if(q&&String(f.field).toLowerCase().indexOf(q)<0)return;
    var s=stat(f); if(S.st&&String(s.code)!==S.st)return;
    list.push(f);stats.push(s);});
  var idx=list.map(function(_,i){return i;}),sk=S.sortK,sd=S.sortD;
  idx.sort(function(a,b){
    var fa=list[a],fb=list[b],sa=stats[a],sb=stats[b],va,vb;
    if(!sk){
      if(S.view==='agro'){va=sa.days==null?-1:sa.days;vb=sb.days==null?-1:sb.days;if(va!==vb)return vb-va;}
      else{var d=ORD[sa.code]-ORD[sb.code];if(d)return d;
        if(sa.code===1)return (sb.days-sb.gap)-(sa.days-sa.gap);
        if(sa.code===4)return (sa.gap-sa.days)-(sb.gap-sb.days);}
      return fa.field<fb.field?-1:1;}
    if(sk==='field'){va=fa.field;vb=fb.field;}
    else if(sk==='estate'){va=fa.estate+'|'+areaOf(fa)+'|'+fa.field;vb=fb.estate+'|'+areaOf(fb)+'|'+fb.field;}
    else if(sk==='area'){va=areaOf(fa)+'|'+fa.field;vb=areaOf(fb)+'|'+fb.field;}
    else if(sk==='crop'){va=sa.c+'|'+sa.sub;vb=sb.c+'|'+sb.sub;}
    else if(sk==='variety'){va=sa.sub||'~';vb=sb.sub||'~';}
    else if(sk==='acres'){va=fa.ha;vb=fb.ha;}
    else if(sk==='last'){va=sa.last||'';vb=sb.last||'';}
    else if(sk==='days'){va=sa.days==null?-1:sa.days;vb=sb.days==null?-1:sb.days;}
    else if(sk==='applied'){va=sa.perAc;vb=sb.perAc;}
    else if(sk==='apps'){va=sa.apps;vb=sb.apps;}
    else if(sk==='left'){var ra=rate(fa),rb=rate(fb);va=ra==null?99:ra-sa.perAc;vb=rb==null?99:rb-sb.perAc;}
    else{va=ORD[sa.code];vb=ORD[sb.code];}
    if(va<vb)return -sd;if(va>vb)return sd;return fa.field<fb.field?-1:1;});
  return {all:all,list:idx.map(function(i){return list[i];}),stats:idx.map(function(i){return stats[i];})};
}

   1 Records (Matthew/agronomist): predicted / planned / started / amount — the Planner.

     finishes, what to start tonight, who moves which machine when, when all machines are in.

   cfg.team {emp:{r:'sup'|'staff'|'mgr',est:[...]}}, and LOCAL.ops {id:op}:

     set  = {t:'set',m,k,run,s,f,spd,ang,mm,emp,pid,plan,end}  a machine started on a run (staff)

// Minimal .xlsx reader (no libraries): unzips with the built-in DecompressionStream and
// returns one sheet as an array of row arrays (strings/numbers). Works in browsers and
// Cloudflare Workers. Used for the Checklist App's AssetList.xlsx.
async function xlsxSheetRows(buf, sheetName) {
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('not an xlsx file');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const files = {};
  for (let k = 0; k < n; k++) {
    const meth = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true),
      xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = { meth, csz, lho }; p += 46 + nl + xl + cl;
  }
  async function read(name) {
    const f = files[name]; if (!f) return null;
    const o = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
    const raw = u8.subarray(o, o + f.csz);
    if (f.meth === 0) return new TextDecoder().decode(raw);
    const s = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(s).arrayBuffer());
  }
  const unx = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d)).replace(/&amp;/g, '&');
  const wb = await read('xl/workbook.xml'), rels = await read('xl/_rels/workbook.xml.rels');
  let rid = null;
  for (const m of wb.matchAll(/<sheet\b[^>]*>/g)) {
    const nm = /name="([^"]*)"/.exec(m[0]), id = /r:id="([^"]*)"/.exec(m[0]);
    if (nm && unx(nm[1]).trim() === sheetName.trim()) rid = id && id[1];
  }
  if (!rid) throw new Error('sheet "' + sheetName + '" not found');
  let target = null;
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) if (m[0].indexOf('Id="' + rid + '"') >= 0) target = /Target="([^"]*)"/.exec(m[0])[1];
  const path = target.replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/');
  const ssx = await read('xl/sharedStrings.xml'), ss = [];
  if (ssx) for (const m of ssx.matchAll(/<si>([\s\S]*?)<\/si>/g)) ss.push(unx([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')));
  const sx = await read(path), rows = [];
  const col = ref => { let c = 0; for (const ch of ref.replace(/\d+/g, '')) c = c * 26 + ch.charCodeAt(0) - 64; return c - 1; };
  for (const rm of sx.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)) {
    const row = [];
    for (const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
      const at = cm[1], r = /r="([A-Z]+\d+)"/.exec(at), t = /t="([^"]*)"/.exec(at), body = cm[2] || '';
      const v = /<v>([\s\S]*?)<\/v>/.exec(body), is = /<is>[\s\S]*?<t[^>]*>([\s\S]*?)<\/t>/.exec(body);
      let val = null;
      if (t && t[1] === 's' && v) val = ss[+v[1]];
      else if (t && t[1] === 'inlineStr' && is) val = unx(is[1]);
      else if (v) val = (t && (t[1] === 'str' || t[1] === 'e')) ? unx(v[1]) : (isNaN(+v[1]) ? unx(v[1]) : +v[1]);
      row[r ? col(r[1]) : row.length] = val;
    }
    rows.push(row);
  }
  return rows;
}
// Irrigators from the Checklist App's AssetList.xlsx ("Front Sheet": Check Type, NameColumn, MakeColumn, Crop, Year)
// NameColumn looks like "B1 A F Machinery 11920207 R64" or "P13 Pickenham E330047 / VR7 600".
function assetIrrigators(rows) {
  const out = [], seen = {};
  const head = (rows[0] || []).map(x => String(x || '').trim().toLowerCase());
  const iT = Math.max(0, head.indexOf('check type')), iN = head.indexOf('namecolumn') >= 0 ? head.indexOf('namecolumn') : 1,
    iM = head.indexOf('makecolumn') >= 0 ? head.indexOf('makecolumn') : 2;
  for (const r of rows.slice(1)) {
    if (!/irrigat/i.test(String(r[iT] || ''))) continue;
    const full = String(r[iN] || '').replace(/\s+/g, ' ').trim(); if (!full) continue;
    const m = /^(\S+)\s+(A F Machinery|Pickenham|Non Existant|[A-Za-z ]+?)\s+(.*)$/i.exec(full);
    const fleet = m ? m[1] : full.split(' ')[0], owner = m ? m[2] : '', rest = m ? m[3].trim() : '';
    if (/non exist/i.test(owner) || seen[fleet]) continue;
    seen[fleet] = 1;
    let serial = rest, model = '';
    if (rest.indexOf(' / ') >= 0) { serial = rest.split(' / ')[0].trim(); model = rest.split(' / ').slice(1).join(' / ').trim(); }
    else { const t = rest.split(' '); model = t.length > 1 ? t.pop() : ''; serial = t.join(' '); }
    const make = String(r[iM] || '').trim();
    out.push({ id: fleet, name: fleet + ' ' + (make ? make + ' ' : '') + model, make, model, serial: serial === 'n/a' ? '' : serial,
      owner, est: /pickenham/i.test(owner) ? 'Pickenham' : '' });
  }
  const key = s => { const m = /^([A-Z]*)(\d*)/i.exec(s); return [m[1].toUpperCase(), +(m[2] || 0)]; };
  out.sort((a, b) => { const x = key(a.id), y = key(b.id); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1]; });
  return out;
}

function mach(id){return machines().filter(function(m){return m.id===id;})[0]||null;}
function runsOf(k){var r=cfg().runs||{};return r[k]?+r[k]:null;}
function team(){return cfg().team||(cfg().team={});}
function myRole(){var u=user();if(!u)return '';var t=team()[u.emp];return t?t.r:(u.role==='admin'?'mgr':'');}
function myEsts(){var u=user(),t=u&&team()[u.emp];return t&&t.est&&t.est.length?t.est:[];}
function nameOf(emp){var x=(FP.USERS||[]).filter(function(u){return u.emp===emp;})[0];return x?x.name:(emp||'—');}
function first(n){return String(n||'').split(' ')[0];}
function fName(k){var f=BYKEY[k];return f?f.field:k;}
function fEst(k){var f=BYKEY[k];return f?f.estate:'';}

// the set currently (or last) on each machine
function machState(id){
  var ss=opList('set').filter(function(s){return s.m===id;}).sort(function(a,b){return a.s<b.s?1:-1;});
  var cur=ss[0]||null,now=nowDT();if(!cur)return {cur:null,running:false,inAt:null};
  var stop=cur.end||cur.f||null;var running=!cur.end&&(!cur.f||cur.f>now);
  return {cur:cur,running:running,inAt:stop,left:stop?minsTo(now,stop):null};
}
// where a field is in its current cycle of runs
function fieldProg(k){
  var N=runsOf(k),ss=opList('set').filter(function(s){return s.k===k;}).sort(function(a,b){return a.s<b.s?-1:1;});
  if(!ss.length)return {N:N,runs:[],pid:null,sets:[],running:[],done:0,complete:false};
  var pid=ss[ss.length-1].pid,cs=ss.filter(function(s){return s.pid===pid;}),now=nowDT(),runs=[],done={};
  cs.forEach(function(s){if(runs.indexOf(s.run)<0)runs.push(s.run);if(s.end||(s.f&&s.f<=now))done[s.run]=1;});
  var running=cs.filter(function(s){var ms=machState(s.m);return ms.cur&&ms.cur.id===s.id&&ms.running;});
  var durs=cs.map(function(s){var e=s.end||s.f;return e?minsTo(s.s,e):0;}).filter(function(x){return x>0;});
  var avg=durs.length?durs.reduce(function(a,b){return a+b;},0)/durs.length:null;
  var lastF=cs.reduce(function(a,s){var e=s.end||s.f||'';return e>a?e:a;},'');
  var remaining=N?Math.max(0,N-runs.length):0;
  var par=Math.max(1,running.length);
  var est=lastF?(remaining&&avg?addMin(lastF,remaining*avg/par):lastF):null;
  return {N:N,runs:runs,pid:pid,sets:cs,running:running,done:Object.keys(done).length,complete:!!(N&&runs.length>=N&&!running.length),est:est,avg:avg,start:cs[0].s};
}
function nextRun(k){var fp=fieldProg(k),N=fp.N;if(!fp.pid||fp.complete)return 1;for(var r=1;r<=(N||99);r++)if(fp.runs.indexOf(r)<0)return r;return 1;}
function progHtml(k,compact){
  var fp=fieldProg(k);if(!fp.pid)return '';
  if(fp.complete&&!compact)return '<span class="small muted">last cycle done '+tShow(fp.est)+'</span>';
  if(fp.complete)return '';
  var pct=fp.N?Math.round(fp.done/fp.N*100):0;
  var run=fp.running.map(function(s){var m=mach(s.m);return (m?m.n:'?')+' run '+s.run+' → '+tShow(s.f);}).join(', ');
  return '<div class="small" style="margin-top:3px"><span style="color:var(--r3);font-weight:700">▶ '+fp.done+(fp.N?'/'+fp.N:'')+' runs</span>'
    +(fp.N?' <span class="bar" style="display:inline-block;width:60px;vertical-align:middle"><i style="width:'+pct+'%"></i></span>':'')
    +(run?' <span class="muted">'+esc(run)+'</span>':'')+(fp.est&&fp.N?' <span class="muted">· field done ~'+tShow(fp.est)+'</span>':'')+'</div>';
}

// STAGE 3 → 1: a machine starts on a run
function startSet(o){
  var f=BYKEY[o.k];if(!f){toast('Pick a field');return false;}
  if(!o.m){toast('Pick a machine');return false;}if(!o.f){toast('Enter the finish time');return false;}
  var u=user(),r=rec(f),s=o.s||nowDT(),day=s.slice(0,10),fp=fieldProg(o.k),pid=null;
  if(fp.pid&&!fp.complete&&fp.runs.indexOf(+o.run)<0)pid=fp.pid;          // carries on the current cycle
  if(!pid){                                                                // first run of a new cycle = a new pass in the Records
    pid=newId();(r.p=r.p||[]).push([day,+o.told||+o.mm||0,+o.mm||0,u?u.emp:'',pid]);
    r.g=(r.g||[]).filter(function(x){return x[0]!==day;});
    if(+o.mm>MIN_MM&&(r.st===2||r.st===3))r.st=0;
    markField(f);
  }
  var ms=machState(o.m);if(ms.cur&&!ms.cur.end&&(!ms.cur.f||ms.cur.f>s)){ms.cur.end=s;opPut(ms.cur);} // machine moved off its last run early
  opPut({id:newId(),t:'set',m:o.m,k:o.k,run:+o.run||1,s:s,f:o.f,spd:o.spd||'',ang:o.ang||'',mm:+o.mm||0,emp:o.emp||(u?u.emp:''),by:u?u.emp:'',pid:pid,plan:o.plan||''});
  if(o.plan){var pl=ops()[o.plan];if(pl){pl.done=1;opPut(pl);}}
  opsCommit();toast('Started '+((mach(o.m)||{}).n||'machine')+' on '+f.field+' run '+(o.run||1));return true;
}
function stopMachine(id){var ms=machState(id);if(!ms.cur)return;if(!confirm('Mark '+((mach(id)||{}).n||'machine')+' as finished / stopped now?'))return;ms.cur.end=nowDT();opPut(ms.cur);opsCommit();}
function delOp(id){var o=ops()[id];if(!o||!confirm('Delete this?'))return;o.x=1;opPut(o);opsCommit();closeModal();}

function stFieldChange(keep){

function stStartDT(){var t=document.getElementById('stS').value||'00:00',d=new Date();var dt=isoOf(d)+'T'+t;if(dt>addMin(nowDT(),60))dt=addDays(isoOf(d),-1)+'T'+t;return dt;}

    +'<div class="kpi"><div class="l">To start</div><div class="v">'+todo.length+'</div><div class="s">due / definitely / programmed</div></div></div>'
    +(M.length?'':'<div class="banner warn">No machines set up'+(sel!=='ALL'?' for '+esc(sel):'')+' yet — add them under <span class="lnk" onclick="go(\'set\')">Settings → Machines</span>.</div>')
    +'<div class="card"><h3>Machines</h3><div class="tw"><table><thead><tr><th class="fn">Machine</th><th>On</th><th class="n">Started</th><th class="n">Finishes</th><th class="hide-m">Speed / angle</th><th>By</th><th>Next move</th><th></th></tr></thead><tbody>'+(mrows||'<tr><td colspan="8" class="muted pad">—</td></tr>')+'</tbody></table></div></div>'
    +'<div class="card"><h3>Tonight’s moves <span class="muted small" style="font-weight:400">in time order — staff see these on their page</span></h3><div class="tw"><table><thead><tr><th class="n">Time</th><th>Staff</th><th>Machine</th><th>From</th><th>To</th><th></th></tr></thead><tbody>'+(plrows||'<tr><td colspan="6" class="muted pad">No moves planned.</td></tr>')+'</tbody></table></div></div>'
    +'<div class="card"><h3>Fields in progress</h3><div class="tw"><table><thead><tr><th class="fn">Field</th><th>Progress</th><th class="n">Started</th><th class="n">Field finishes ~</th><th></th></tr></thead><tbody>'+(prows||'<tr><td colspan="5" class="muted pad">Nothing part-way through.</td></tr>')+'</tbody></table></div></div>'
    +'<div class="card"><h3>To start — from the Records <span class="muted small" style="font-weight:400">due (1), definitely start (2) and programmed (3), not yet planned</span></h3><div class="tw"><table><thead><tr><th class="fn">Field</th><th>Status</th><th class="n">Area</th><th class="n">Runs</th><th></th></tr></thead><tbody>'+(trows||'<tr><td colspan="5" class="muted pad">Nothing waiting.</td></tr>')+'</tbody></table></div></div>';
}

/* ── STAGE 3: staff page ──────────────────────────────────────────────── */
function vStaff(){
  if(is26())return '<div class="banner info">The staff page runs on the '+LIVE_YR+' season.</div>';
  var u=user();if(!u)return '<div class="card"><div class="pad"><p>Sign in with your employee number to see your moves.</p><button class="btn" onclick="signIn()">Sign in</button></div></div>';
  var T=isoOf(new Date()),now=nowDT();
  var who=S.staffAs||u.emp;
  var mine=opList('plan').filter(function(p){return p.emp===who&&!p.done&&p.d>=addDays(T,-1);}).sort(function(a,b){return (a.d+a.at)<(b.d+b.at)?-1:1;});
  var running=machines().map(function(m){return [m,machState(m.id)];}).filter(function(x){return x[1].cur&&x[1].cur.emp===who&&(x[1].running||x[1].inAt>addMin(now,-180));});
  var card=function(inner,col){return '<div style="background:#fff;border:1px solid var(--bd);border-left:6px solid '+col+';border-radius:10px;padding:12px 14px;margin-bottom:10px">'+inner+'</div>';};
  var mv=mine.map(function(p){var m=mach(p.m),st=machState(p.m),f=BYKEY[p.k];
    return card('<div style="display:flex;align-items:center;gap:10px"><div style="font-family:var(--serif);font-weight:600;font-size:26px;color:var(--g1)">'+esc(p.at)+'</div><div style="flex:1"><div style="font-size:16px"><b>'+esc(m?m.n:'?')+'</b></div>'
      +'<div class="small muted">'+(st.cur?'now on '+esc(fName(st.cur.k))+' run '+st.cur.run+(st.running?' · finishes '+tShow(st.inAt):' · finished '+tShow(st.inAt)):'not running')+'</div></div></div>'
      +'<div style="font-size:17px;margin:8px 0">Move to <b>'+esc(f?f.field:p.k)+'</b> · run <b>'+p.run+'</b>'+(runsOf(p.k)?' of '+runsOf(p.k):'')+(p.mm?' · <b>'+p.mm+'mm</b>':'')+'</div>'
      +(p.d!==T?'<div class="small muted">planned for '+dm(p.d)+'</div>':'')
      +'<button class="btn" style="width:100%;padding:14px;font-size:16px" onclick="openStart('+jsq(p.id)+')">▶ I’ve moved it — start</button>','var(--r3)');}).join('');
  var rn=running.map(function(x){var m=x[0],st=x[1],c=st.cur;
    return card('<div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b style="font-size:16px">'+esc(m.n)+'</b><div>'+esc(fName(c.k))+' · run '+c.run+(runsOf(c.k)?' of '+runsOf(c.k):'')+'</div>'
      +'<div class="small muted">started '+tShow(c.s)+(c.spd?' · '+c.spd+' m/h':'')+(c.ang?' · '+c.ang+'°':'')+'</div></div>'
      +'<div style="text-align:right">'+(st.running?'<div class="small muted">finishes</div><div style="font-family:var(--serif);font-weight:600;font-size:24px;color:var(--g1)">'+tShow(st.inAt)+'</div><div class="small">'+durShow(st.left)+' left</div>':'<span class="badge c6">finished '+tShow(st.inAt)+'</span>')+'</div></div>'
      +(st.running?'<button class="btn r sm" style="margin-top:8px" onclick="stopMachine('+jsq(m.id)+')">Stopped early</button>':''),st.running?'var(--g2)':'#bbb');}).join('');
  var T2=team(),sel='';
  if(myRole()==='sup'||myRole()==='mgr'){var st=Object.keys(T2).filter(function(e){return T2[e].r==='staff';});
    sel='<div class="filters"><span class="small muted">Showing the page for</span><select onchange="S.staffAs=this.value;render()"><option value="'+esc(u.emp)+'">me</option>'+st.map(function(e){return '<option value="'+esc(e)+'"'+(e===who?' selected':'')+'>'+esc(nameOf(e))+'</option>';}).join('')+'</select></div>';}
  return sel+'<h3 style="font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.4px;color:var(--tx);margin:4px 0 10px">'+esc(first(nameOf(who)))+'’s moves</h3>'+(mv||'<div class="muted pad">No moves planned for you.</div>')
    +'<h3 style="font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.4px;color:var(--tx);margin:18px 0 10px">Machines you’ve started</h3>'+(rn||'<div class="muted pad">None running.</div>')
    +'<button class="btn o" style="width:100%;padding:12px;margin-top:8px" onclick="openStart(null)">+ Start a machine that wasn’t planned</button>';
}

function fieldSetsHtml(k){
  var fp=fieldProg(k);if(!fp.pid)return '';
  return '<div class="small" style="margin:6px 0 4px;color:var(--g1);font-weight:600">Current cycle — machine runs</div><div class="plist">'+fp.sets.slice().reverse().map(function(x){var m=mach(x.m);
    return '<div><b style="min-width:48px">run '+x.run+'</b><span>'+esc(m?m.n:'?')+'</span><span class="muted">'+tShow(x.s)+' → '+tShow(x.end||x.f)+'</span><span class="muted small" style="flex:1">'+(x.spd?x.spd+' m/h ':'')+(x.ang?x.ang+'° ':'')+(x.mm?x.mm+'mm ':'')+esc(first(nameOf(x.emp)))+'</span><button class="x" onclick="delOp('+jsq(x.id)+')">✕</button></div>';}).join('')+'</div>';
}
/* ── settings: machines & team ────────────────────────────────────────── */
function setupInfo(){var u=user();return '<div class="card"><div class="pad small">Signed in as <b>'+esc(u?u.name:'')+'</b> ('+esc(u?u.emp:'')+') · '+({sup:'Supervisor',staff:'Staff',mgr:'Manager'}[myRole()]||'not on the irrigation team yet')+(myEsts().length?' · '+esc(myEsts().join(', ')):'')+'<div style="margin-top:8px"><button class="btn r sm" onclick="signOut()">Sign out of this phone</button></div></div></div>';}
function setupHtml(){
  var M=machines(),ests=estChoices(),T=team(),C=cfg(),src=assetSrc(),AL=assetList(),off=C.machOff||{},home=C.machEst||{};
  var eOpts=function(sel){return '<option value="">—</option>'+ests.map(function(e){return '<option'+(e===sel?' selected':'')+'>'+esc(e)+'</option>';}).join('');};
  var arows=AL.map(function(a){var id='A:'+a.id,m=mach(id)||{id:id,est:home[a.id]||a.est||''},st=machState(id);
    return '<tr'+(off[a.id]?' style="opacity:.5"':'')+'><td><b>'+esc(a.id)+'</b></td><td>'+esc(a.make)+' '+esc(a.model)+'<div class="muted small">'+esc(a.serial||'')+(a.owner?' · '+esc(a.owner):'')+'</div></td>'
      +'<td class="small">'+(st.cur?esc(machEst(m))+(st.running?' <span class="badge c4">running</span>':''):'<span class="muted">—</span>')+'</td>'
      +'<td><select onchange="machHome('+jsq(a.id)+',this.value)" style="padding:4px">'+eOpts(home[a.id]||a.est||'')+'</select></td>'
      +'<td><input type="checkbox"'+(off[a.id]?'':' checked')+' onchange="machUse('+jsq(a.id)+',this.checked)"></td></tr>';}).join('');
  var xrows=(C.mach||[]).map(function(m,i){return '<tr><td><b>'+esc(m.n)+'</b></td><td class="muted small">added here</td><td class="small">'+esc(machEst(m)||'—')+'</td>'
    +'<td><select onchange="cfg().mach['+i+'].est=this.value;cfgTouch()" style="padding:4px">'+eOpts(m.est)+'</select></td>'
    +'<td><button class="x" onclick="if(confirm(\'Remove '+esc(m.n).replace(/'/g,'')+'?\')){cfg().mach.splice('+i+',1);cfgTouch();}">✕</button></td></tr>';}).join('');
  var mrows=arows+xrows;
  var trows=Object.keys(T).sort(function(a,b){return nameOf(a)<nameOf(b)?-1:1;}).map(function(e){var t=T[e];
    return '<tr><td>'+esc(nameOf(e))+' <span class="muted small">'+esc(e)+'</span></td><td><select onchange="team()['+jsq(e)+'].r=this.value;cfgTouch()" style="padding:5px">'
      +[['staff','Staff'],['sup','Supervisor'],['mgr','Manager / agronomist']].map(function(r){return '<option value="'+r[0]+'"'+(t.r===r[0]?' selected':'')+'>'+r[1]+'</option>';}).join('')+'</select></td>'
      +'<td class="small">'+ests.map(function(x){return '<label style="white-space:nowrap;margin-right:6px"><input type="checkbox"'+((t.est||[]).indexOf(x)>=0?' checked':'')+' onchange="teamEst('+jsq(e)+','+jsq(x)+',this.checked)"> '+esc(x)+'</label>';}).join(' ')+'</td>'
      +'<td><button class="x" onclick="delete team()['+jsq(e)+'];cfgTouch()">✕</button></td></tr>';}).join('');
  var uopts=(FP.USERS||[]).filter(function(x){return !T[x.emp];}).map(function(x){return '<option value="'+esc(x.name+' ('+x.emp+')')+'">';}).join('');
  var zc=(FP.WATER_CFG.zones||[]).filter(function(z){return z.machines;}).map(function(z){return esc(z.name)+' '+z.machines;}).join(' · ');
  return '<div class="card"><h3>🚿 Machines <span class="muted small" style="font-weight:400">'+(src?AL.length+' irrigators from the Checklist App asset list · '+esc(src.src)+(SRC.assets?' · '+esc(SRC.assets):''):'not loaded yet')+'</span></h3><div class="pad small">'
    +'<div class="muted" style="margin-bottom:8px">The machine list comes from the <b>Checklist App asset list</b> (AssetList.xlsx, “Irrigator” rows) so it’s the same list the daily checks use. <b>Now on</b> follows the machine — it’s the estate of the field it was last started on. <b>Home</b> is only where a machine sits before it’s first used. Untick machines that are off the fleet.</div>'
    +'<div class="filters"><label class="btn sm" style="display:inline-block">⬆ Import AssetList.xlsx<input type="file" accept=".xlsx" style="display:none" onchange="importAssets(this)"></label>'
    +'<button class="btn o sm" onclick="loadAssets(true).then(render)">↻ Re-read shared file</button></div>'
    +'<div class="tw" style="max-height:50vh"><table><thead><tr><th>Fleet no</th><th>Machine</th><th>Now on</th><th>Home</th><th>In use</th></tr></thead><tbody>'+(mrows||'<tr><td colspan="5" class="muted">No machines yet — import the asset list.</td></tr>')+'</tbody></table></div>'
    +'<div class="filters" style="margin-top:8px"><span class="muted">Not on the asset list (e.g. hired):</span><input id="nmN" placeholder="name"><select id="nmE">'+eOpts('')+'</select><button class="btn o sm" onclick="addMach()">+ Add</button></div></div></div>'
    +'<div class="card"><h3>👥 Team</h3><div class="pad small"><div class="muted" style="margin-bottom:8px">Supervisors open on the Supervisor page for their estates; staff open on their own Moves page. Everyone signs in with their FieldPlan employee number — no PIN. Only people listed here (plus FieldPlan admins/editors) can record irrigation.</div>'
    +'<div class="tw"><table><thead><tr><th>Person</th><th>Role</th><th>Estates</th><th></th></tr></thead><tbody>'+(trows||'<tr><td colspan="4" class="muted">Nobody yet.</td></tr>')+'</tbody></table></div>'
    +'<div class="filters" style="margin-top:8px"><input id="ntU" list="ntUs" placeholder="add a person…" style="min-width:220px"><datalist id="ntUs">'+uopts+'</datalist><select id="ntR"><option value="staff">Staff</option><option value="sup">Supervisor</option><option value="mgr">Manager / agronomist</option></select><button class="btn sm" onclick="addTeam()">+ Add</button></div></div></div>';
}
function addMach(){var n=document.getElementById('nmN').value.trim();if(!n){toast('Name the machine');return;}(cfg().mach=cfg().mach||[]).push({id:newId(),n:n,est:document.getElementById('nmE').value});cfgTouch();}
function addTeam(){var v=document.getElementById('ntU').value,m=/\((\w+)\)\s*$/.exec(v);if(!m){toast('Pick a person from the list');return;}team()[m[1]]={r:document.getElementById('ntR').value,est:[]};cfgTouch();}
function teamEst(e,x,on){var t=team()[e];t.est=(t.est||[]).filter(function(y){return y!==x;});if(on)t.est.push(x);cfgTouch();}
function setRuns(k,v){if(!canEdit())return;var n=parseInt(v);if(n>0)cfg().runs[k]=n;else delete cfg().runs[k];cfgTouch();}
function setRunLen(k,v){if(!canEdit())return;var n=parseFloat(v);if(n>0)cfg().runLen[k]=n;else delete cfg().runLen[k];cfgTouch();}

/* ── shell ─────────────────────────────────────────────────────────────── */
var VIEWS=[['plan','Records'],['sup','Supervisor'],['staff','My moves'],['log','Log pass'],['agro','Last watered'],['tot','Totals'],['set','Settings']];
function go(v){S.view=v;saveUi();render();window.scrollTo(0,0);}
function setSeason(y){S.season=y;ZMAP=null;S.st='';render();}
function render(){
  if(!FP||!LOCAL)return;
  var u=user();
  document.getElementById('who').textContent=u?u.name.split(' ')[0]:'Sign in';paintLive();
  document.getElementById('seasonSeg').innerHTML=[[LIVE_YR,LIVE_YR+' live'],['2026','2026 records']].map(function(x){return '<button class="'+(S.season===x[0]?'on':'')+'" onclick="setSeason(\''+x[0]+'\')">'+x[1]+'</button>';}).join('');
  var n=nPending(),b=document.getElementById('saveBtn');b.textContent=SAVING?'Saving…':n?(_saveErr?'Save ('+n+')':'Saving '+n+'…'):'Saved ✓';b.className='savebtn'+(n?' dirty':'');
  var VV=myRole()==='staff'?VIEWS.filter(function(v){return v[0]==='staff'||v[0]==='agro';}):VIEWS;if(VV.every(function(v){return v[0]!==S.view;}))S.view=VV[0][0];
  document.getElementById('seasonSeg').style.display=myRole()==='staff'?'none':'';
  document.getElementById('nav').innerHTML=VV.map(function(v){return '<button class="'+(S.view===v[0]?'on':'')+'" onclick="go(\''+v[0]+'\')">'+v[1]+'</button>';}).join('');
  var top='';
  if(n&&_saveErr)top+='<div class="banner warn">⚠ <b>'+n+' change'+(n>1?'s':'')+' not saved yet</b> — '+esc(_saveErr)+'. They are kept on this device and will send automatically.</div>';
  if(is26())top+='<div class="banner info">Viewing the <b>2026 records</b> (read-only, from the spreadsheet) as at <input type="date" value="'+S.asAt+'" min="2026-03-23" max="2026-10-24" onchange="S.asAt=this.value;saveUi();render()" style="padding:2px 4px">. Statuses are worked out as if it were that day.</div>';
  if(!u)top+='<div class="banner warn">Not signed in — varieties/onion types from Omnia need sign-in, and so does saving. <span class="lnk" onclick="signIn()">Sign in</span></div>';
  var html={plan:vPlanner,sup:vSup,staff:vStaff,log:vLog,agro:vAgro,tot:vTotals,set:vSettings}[S.view]||vPlanner;
  var y=window.scrollY;document.getElementById('main').innerHTML=top+html();window.scrollTo(0,y);
  document.documentElement.style.setProperty('--hh',document.getElementById('hdr').offsetHeight+'px');
  if(S.view==='log'&&window._logKey){var lf=document.getElementById('lgField');if(lf)logPick(lf.value);}
}

/* ── boot ──────────────────────────────────────────────────────────────── */
async function loadFieldPlan(force){
  var cached=null;try{cached=JSON.parse(localStorage.getItem('irr_fp_cache')||'null');}catch(e){}
  if(cached&&!force&&!FP){FP=cached;buildFns();indexF();SRC.fp='cached copy '+new Date(cached.t).toLocaleString('en-GB');}
  try{
    var r=await fetch(FP_URL+(FP_URL.indexOf('?')<0?'?':'&')+'t='+Math.floor(Date.now()/60000),{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var fresh=parseFieldPlan(await r.text());
    FP=fresh;buildFns();indexF();ZMAP=null;SRC.fp='live, read '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · '+FP.F.length+' fields';
    try{localStorage.setItem('irr_fp_cache',JSON.stringify(FP));}catch(e){}
  }catch(e){if(!FP)throw e;SRC.fp+=' (live read failed: '+e.message+')';}
}
async function loadR26(){try{var r=await fetch((QS.get('r26')||RAW+'irr_2026.json')+'?t='+Math.floor(Date.now()/3600000));if(r.ok)R26=await r.json();}catch(e){}}
async function refreshAll(force){
  await loadFieldPlan(force);
  try{var oc=JSON.parse(localStorage.getItem('irr_om_cache')||'null');if(oc&&!OMT){Object.assign(OMV,oc.v);SRC.om='last copy '+new Date(oc.t).toLocaleString('en-GB');}}catch(e){}
  render();
  await loadOmnia();ZMAP=null;await loadAssets(force);render();
}
(async function boot(){
  try{
    await Promise.all([loadFieldPlan(false),loadR26()]);
    try{var oc=JSON.parse(localStorage.getItem('irr_om_cache')||'null');if(oc){Object.assign(OMV,oc.v);SRC.om='last copy '+new Date(oc.t).toLocaleString('en-GB');}}catch(e){}
    if(!user()){await new Promise(function(res){signIn(res,true);});}
    await loadData();
    if(!_s0){var rr=myRole();S.view=rr==='sup'?'sup':rr==='staff'?'staff':S.view;}
    render();
    loadOmnia().then(function(){ZMAP=null;render();});
    loadAssets();
  }catch(e){
    document.getElementById('main').innerHTML='<div class="banner err">Could not load FieldPlan: '+esc(e.message)+'. Check your connection and reload.</div>';
  }
})();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&LOCAL){pull();if(nPending())save(true);}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('irr-sw.js').catch(function(){});
window.addEventListener('beforeunload',function(e){if(nPending()){e.preventDefault();e.returnValue='';}});
</script>
